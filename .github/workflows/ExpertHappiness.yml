name: ExpertHappiness

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-ubuntu:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        id: build
      - name: Install curl (required by Codecov uploader)
        if: steps.build.outputs.contains-code-coverage == 'true'
        run: apt-get update -q && apt-get install -y -q curl
      - name: Upload coverage to Codecov
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          flags: ubuntu
          token: ${{ secrets.CODECOV_TOKEN }}

  build-macos:
    name: Build on macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        id: build
        with:
          type: spm
      - name: Upload coverage to Codecov
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v6
        with:
          flags: macos
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Lint
        run: ./Scripts/lint.sh
